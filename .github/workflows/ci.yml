name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: yarn.lock
          package-manager-cache: false

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile

      - name: Audit runtime dependencies
        run: npx --yes yarn@1.22.22 audit --groups dependencies

      - name: Run tests
        run: npx --yes yarn@1.22.22 test

      - name: Build demo
        run: npx --yes yarn@1.22.22 build

      - name: Build publishable library
        run: npx --yes yarn@1.22.22 prepublishOnly

      - name: Smoke-test consumer import
        run: node -e "const library=require('./build/web-marker.js'); if(typeof library.Marker!=='function') process.exit(1)"

      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts
